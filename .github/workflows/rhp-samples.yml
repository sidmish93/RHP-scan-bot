name: Send sample filings

# Manual only. Resends one DRHP, one RHP, and one UDRHP already on SEBI.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: DRHP, UDRHP, or RHP. Leave blank to send one of each.
        required: false
        default: ""
      companies:
        description: Comma-separated company names already on SEBI. Leave blank for the default three.
        required: false
        default: ""

concurrency:
  group: rhp-samples
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: pip install -r requirements.txt

      - name: Send one filing of each kind
        env:
          RHP_BOT_TOKEN: ${{ secrets.RHP_BOT_TOKEN }}
          RHP_CHAT_ID: ${{ secrets.RHP_CHAT_ID }}
          SAMPLE_KIND: ${{ inputs.kind }}
          SAMPLE_COMPANIES: ${{ inputs.companies }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          command = [sys.executable, "-m", "rhpbot.bot", "--samples"]
          kind = os.environ.get("SAMPLE_KIND", "").strip()
          if kind:
              command += ["--kind", kind]
          for name in os.environ.get("SAMPLE_COMPANIES", "").split(","):
              if name.strip():
                  command += ["--company", name.strip()]
          raise SystemExit(subprocess.call(command))
          PY
