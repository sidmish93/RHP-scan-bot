name: Confirm chat

# One dispatch to prove the chat can receive a message. Not on the schedule.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send welcome
        env:
          RHP_BOT_TOKEN: ${{ secrets.RHP_BOT_TOKEN }}
          RHP_CHAT_ID: ${{ secrets.RHP_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["RHP_BOT_TOKEN"]
          chat = os.environ["RHP_CHAT_ID"]
          text = (
              "RHP bot is on.\n"
              "I post a new DRHP, UDRHP, or RHP when it is filed with SEBI, with the "
              "issue size, fresh issue, offer for sale, bankers, and selling shareholders "
              "when the document states them."
          )
          body = json.dumps({
              "chat_id": chat,
              "text": text,
              "disable_web_page_preview": True,
          }).encode()
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=body,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          print("sent" if payload.get("ok") else "failed")
          PY
